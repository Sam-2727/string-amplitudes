{# A two-state color-mode control. Light is the default configured in conf.py. #}
<div class="theme-switch-container pst-js-only">
  <button
    type="button"
    class="btn btn-sm nav-link pst-navbar-icon sa-theme-toggle"
    aria-label="Switch to dark theme"
    title="Switch to dark theme"
  >
    <i class="sa-theme-toggle__moon fa-solid fa-moon fa-lg fa-fw" aria-hidden="true"></i>
    <i class="sa-theme-toggle__sun fa-solid fa-sun fa-lg fa-fw" aria-hidden="true"></i>
  </button>
</div>
