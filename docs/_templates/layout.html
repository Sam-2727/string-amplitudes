{% extends "!layout.html" %}

{% block css %}
  <script data-cfasync="false">
    try {
      const storedMode = localStorage.getItem("mode");
      if (storedMode !== "light" && storedMode !== "dark") {
        localStorage.setItem("mode", "light");
        localStorage.setItem("theme", "light");
      }
    } catch (error) {
      // The theme still defaults to light when browser storage is unavailable.
    }
  </script>
  {{ super() }}
{% endblock %}

{% block htmltitle %}
  <title>string amplitudes</title>
{% endblock %}
