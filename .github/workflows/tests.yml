name: Package checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: python -m pip install -e .

      - name: Compile package
        run: python -m compileall -q src

      - name: Verify public imports
        run: >-
          python -c "from string_amplitudes import
          generate_ribbon_graphs, get_boundary_data, sample_ribbon_graph;
          assert callable(generate_ribbon_graphs);
          assert callable(get_boundary_data);
          assert callable(sample_ribbon_graph)"
